<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - ChemActiva Innovations</title>
    <meta name="description" content="Explore our innovative range of sustainable nanocellulose products including Greenulose™, domestic and marine oil spill kits.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/products-modern.css">
    <link rel="stylesheet" href="/css/mobile-fixes.css">
    
    <link rel="icon" type="image/png" href="/assets/images/logo-small_size.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="products-page">
    <div id="main-container">
        <header id="navbar">
            <div class="container">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.png" alt="ChemActiva Logo" id="navbar-logo-img">
                </a>
                <nav class="nav-links">
                    <a href="/#about-us">About</a>
                    <a href="/#our-journey">Journey</a>
                    <a href="/products" class="active-nav-link">Products</a>
                    <a href="/#innovation">Innovation</a>
                    <a href="/blog">Blog</a>
                    <a href="/#our-team">Team</a>
                    <a href="/#contact">Contact</a>
                    <div class="theme-switcher theme-switcher-mobile">
                        <input type="checkbox" id="theme-toggle-mobile" class="theme-toggle-checkbox">
                        <label for="theme-toggle-mobile" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                </nav>
                <div class="controls-container">
                    <div class="theme-switcher" id="theme-switcher-desktop">
                        <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                        <label for="theme-toggle" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                    <button id="hamburger-menu" aria-label="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Hero Section -->
            <section class="products-hero">
                <div class="products-hero-content">
                    <h1>Our Innovative Products</h1>
                    <p class="products-hero-subtitle">Sustainable solutions powered by nanocellulose technology</p>
                    <div class="products-hero-badges">
                        <div class="hero-badge">
                            <div class="hero-badge-icon">🌱</div>
                            <div class="hero-badge-label">100% Biodegradable</div>
                        </div>
                        <div class="hero-badge">
                            <div class="hero-badge-icon">🔬</div>
                            <div class="hero-badge-label">Plant-Based</div>
                        </div>
                        <div class="hero-badge">
                            <div class="hero-badge-icon">♻️</div>
                            <div class="hero-badge-label">Eco-Friendly</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Products Grid -->
            <section class="products-section">
                <div class="products-grid" id="products-grid">
                    <!-- Products will be loaded here -->
                </div>
            </section>
        </main>

        <footer id="footer">
            <div class="container">
                <p>© <span id="current-year"></span> ChemActiva Innovations Pvt Ltd. All rights reserved.</p>
                <p>Pioneering Sustainable Nano Cellulose</p>
            </div>
        </footer>
    </div>

    <script src="/js/sw-register.js"></script>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/core.CmOfqZsh.js"></script>
    
    <script>
    // Products Data - Using ALL available images
    const products = [
        {
            id: 'domestic-oil-spill-kit',
            name: 'Domestic Oil Spill Kit (DOSK)',
            tagline: 'Safe | Sustainable | Taste-Preserving',
            description: 'Advanced cellulose-based absorbent designed for home use. Absorbs oil up to 50 times its weight while remaining completely biodegradable. Perfect for kitchen spills and household oil cleanup.',
            category: 'Oil Spill Solution',
            images: [
                '/assets/images/products/Domestic_oil_spill_kit_1.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_1.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_2.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_3.webp'
            ],
            features: ['Kitchen Safe', 'Easy to Use', 'Non-Toxic', 'Biodegradable']
        },
        {
            id: 'greenulose-nano-cellulose',
            name: 'Greenulose™ Nano-Crystalline Cellulose',
            tagline: 'High-Performance | Biodegradable | Plant-Based',
            description: 'Sodium salt of carboxylated crystalline nano cellulose, derived from renewable plant sources. Available in both powder and liquid forms for diverse industrial applications. Delivers exceptional performance with minimal environmental impact.',
            category: 'Greenulose™',
            images: [
                '/assets/images/products/Nano_cellulose_1.webp',
                '/assets/images/products/Greenulose_25g_bottle.webp',
                '/assets/images/products/Greenulose_100g_bottle.webp',
                '/assets/images/products/Greenulose_25g_50g_100g_all_bottles.webp',
                '/assets/images/products/Nano_cellulose_2.webp',
                '/assets/images/products/Nano_cellulose_3.webp',
                '/assets/images/products/Nano_cellulose_4.webp',
                '/assets/images/products/Crystalline_Nano_Cellulose.webp',
                '/assets/images/products/Crystalline_Nano_Cellulose_50gm.webp'
            ],
            features: ['Plant-Based', 'Biodegradable', 'High Performance', 'Versatile Applications']
        },
        {
            id: 'marine-oil-spill-kit',
            name: 'Marine Oil Spill Kit',
            tagline: 'Marine Grade | Biodegradable | Fast Acting',
            description: 'Professional-grade cellulose-based absorbent specifically designed for marine environments. Provides rapid and effective oil spill cleanup while being environmentally safe. Ideal for maritime operations and coastal protection.',
            category: 'Marine Solutions',
            images: [
                '/assets/images/products/Marine_oil_spill_kit.webp',
                '/assets/images/Panel_2_Oil_Spill_Kits.webp'
            ],
            features: ['Marine Grade', 'Biodegradable', 'Fast Acting', 'Eco-Safe']
        }
    ];

    // Render Products
    function renderProducts() {
        const grid = document.getElementById('products-grid');
        
        grid.innerHTML = products.map(product => {
            const imageCount = product.images.length;
            
            return `
                <article class="product-card" data-product-id="${product.id}">
                    <div class="product-gallery">
                        <div class="product-category">${product.category}</div>
                        ${imageCount > 1 ? `<div class="image-count">📸 ${imageCount} Images</div>` : ''}
                        <img src="${product.images[0]}" 
                             alt="${product.name}" 
                             class="product-main-image"
                             loading="lazy">
                        ${imageCount > 1 ? `
                            <div class="product-thumbnails">
                                ${product.images.map((img, idx) => `
                                    <img src="${img}" 
                                         alt="View ${idx + 1}" 
                                         class="product-thumbnail ${idx === 0 ? 'active' : ''}"
                                         data-index="${idx}"
                                         loading="lazy">
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="product-content">
                        <h2>${product.name}</h2>
                        <p class="product-tagline">${product.tagline}</p>
                        <p class="product-description">${product.description}</p>
                        <div class="product-features">
                            ${product.features.map(feature => `
                                <span class="feature-badge">${feature}</span>
                            `).join('')}
                        </div>
                        <div class="product-cta">
                            <a href="#contact" class="btn-primary">
                                Request Quote 📩
                            </a>
                            <a href="#contact" class="btn-secondary">
                                Learn More →
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }).join('');

        // Add click handlers for thumbnails
        document.querySelectorAll('.product-thumbnail').forEach(thumb => {
            thumb.addEventListener('click', function() {
                const card = this.closest('.product-card');
                const mainImage = card.querySelector('.product-main-image');
                const allThumbs = card.querySelectorAll('.product-thumbnail');
                
                // Update main image
                mainImage.style.opacity = '0';
                setTimeout(() => {
                    mainImage.src = this.src;
                    mainImage.style.opacity = '1';
                }, 200);
                
                // Update active state
                allThumbs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                // Haptic feedback on mobile
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    }

    // Initialize
    renderProducts();
    
    // Update year
    document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
