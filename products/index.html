<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - ChemActiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Stix+Two+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/sections.css">
    <link rel="stylesheet" href="/css/products-redesigned.css">
    <link rel="stylesheet" href="/css/mobile-fixes.css">
    <link rel="stylesheet" href="/css/enhanced-interactions.css">
    <link rel="icon" type="image/png" href="/assets/images/logo-small_size.png">
</head>
<body class="products-page">
    <div id="main-container">
        <header id="navbar">
            <div class="container">
                <a href="/" class="logo">
                    <img src="/assets/images/logo.png" alt="ChemActiva Logo" id="navbar-logo-img">
                </a>
                <nav class="nav-links">
                    <a href="/#about-us">About</a>
                    <a href="/#our-journey">Journey</a>
                    <a href="/products" class="active-nav-link">Products</a>
                    <a href="/#innovation">Innovation</a>
                    <a href="/blog">Blog</a>
                    <a href="/#our-team">Team</a>
                    <a href="/#contact">Contact</a>
                    <div class="theme-switcher theme-switcher-mobile">
                        <input type="checkbox" id="theme-toggle-mobile" class="theme-toggle-checkbox">
                        <label for="theme-toggle-mobile" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                </nav>
                <div class="controls-container">
                    <div class="theme-switcher" id="theme-switcher-desktop">
                        <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                        <label for="theme-toggle" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                    <button id="hamburger-menu" aria-label="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <section class="products-hero">
                <div class="container">
                    <div class="hero-content">
                        <h1>Our Innovative Products</h1>
                        <p>Sustainable solutions for a cleaner world</p>
                        <div class="hero-stats">
                            <div class="stat">
                                <span class="stat-number">100%</span>
                                <span class="stat-label">Biodegradable</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number">Plant</span>
                                <span class="stat-label">Based</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number">Eco</span>
                                <span class="stat-label">Friendly</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="products-showcase">
                <div class="container">
                    <div class="products-grid" id="products-grid">
                        <!-- Products will be loaded dynamically -->
                        <p class="placeholder-text">Loading products...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer id="footer">
            <div class="container">
                <p>© <span id="current-year"></span> ChemActiva Innovations Pvt Ltd. All rights reserved.</p>
                <p>Pioneering Sustainable Nano Cellulose</p>
            </div>
        </footer>
    </div>

    <script src="/js/sw-register.js"></script>
    <script type="module" src="/js/mobile-enhancements.js"></script>
    <script type="module" src="/js/visual-enhancements.js"></script>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/core.CmOfqZsh.js"></script>
    
    <script type="module">
    // Products data with WebP images only
    const products = [
        {
            id: 'domestic-oil-spill-kit',
            name: 'Domestic Oil Spill Kit (DOSK)',
            subtitle: 'Safe | Sustainable | Taste-Preserving',
            keyBenefit: 'Our oil absorbent kit is cleaner, safer, and more sustainable solution for domestic oil spills',
            mainImage: '/assets/images/products/Domestic_oil_spill_kit_1.webp',
            images: [
                '/assets/images/products/Domestic_oil_spill_kit_1.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_1.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_2.webp',
                '/assets/images/products/Domestic_oil_spill_kit_collage_3.webp'
            ],
            category: 'Oil Spill Solution',
            features: ['Kitchen Safe', 'Easy to Use', 'Non-Toxic'],
            description: 'Advanced cellulose-based absorbent designed for home use. Absorbs oil up to 50 times its weight while remaining completely biodegradable.'
        },
        {
            id: 'greenulose-nano-cellulose',
            name: 'Greenulose™ Nano-Crystalline Cellulose',
            subtitle: 'High-Performance | Biodegradable | Plant-Based',
            keyBenefit: 'Revolutionary nanocellulose technology for advanced applications',
            mainImage: '/assets/images/products/Nano_cellulose_1.webp',
            images: [
                '/assets/images/products/Nano_cellulose_1.webp',
                '/assets/images/products/Greenulose_25g_bottle.webp',
                '/assets/images/products/Greenulose_100g_bottle.webp',
                '/assets/images/products/Greenulose_25g_50g_100g_all_bottles.webp'
            ],
            category: 'Greenulose™',
            features: ['Plant-Based', 'Biodegradable', 'High Performance'],
            description: 'Sodium salt of carboxylated crystalline nano cellulose, available in powder and liquid forms for diverse industrial applications.'
        },
        {
            id: 'marine-oil-spill-kit',
            name: 'Marine Oil Spill Kit',
            subtitle: 'Marine Grade | Biodegradable | Fast Acting',
            keyBenefit: 'Professional-grade solution for marine oil spill management',
            mainImage: '/assets/images/products/Marine_oil_spill_kit.webp',
            images: ['/assets/images/products/Marine_oil_spill_kit.webp'],
            category: 'Marine Solutions',
            features: ['Marine Grade', 'Biodegradable', 'Fast Acting'],
            description: 'Specialized cellulose-based absorbent for marine environments, providing rapid and effective oil spill cleanup.'
        }
    ];

    function renderProducts() {
        const grid = document.getElementById('products-grid');
        
        grid.innerHTML = products.map((product, index) => {
            const hasGallery = product.images && product.images.length > 1;
            
            return `
                <div class="product-card-modern" style="animation-delay: ${index * 0.1}s">
                    ${hasGallery ? `
                        <div class="product-card-image-gallery" data-product-id="${product.id}">
                            <div class="product-main-image">
                                <img src="${product.mainImage}" alt="${product.name}" loading="lazy" class="main-product-image">
                            </div>
                            <div class="product-thumbnail-grid">
                                ${product.images.map((img, imgIndex) => `
                                    <img src="${img}" 
                                         alt="Image ${imgIndex + 1}" 
                                         class="product-thumbnail ${imgIndex === 0 ? 'active' : ''}" 
                                         data-index="${imgIndex}" 
                                         loading="lazy">
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="product-card-image">
                            <img src="${product.mainImage}" alt="${product.name}" loading="lazy">
                        </div>
                    `}
                    <div class="product-card-overlay">
                        <div class="product-category">${product.category}</div>
                    </div>
                    <div class="product-card-content">
                        <h3>${product.name}</h3>
                        <p class="product-subtitle">${product.subtitle}</p>
                        <p class="product-description">${product.description}</p>
                        <div class="product-features">
                            ${product.features.map(feature => `<span class="feature-tag">${feature}</span>`).join('')}
                        </div>
                        <div class="product-card-action">
                            <span class="learn-more">Learn More →</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // Add click handlers for thumbnails
        document.querySelectorAll('.product-thumbnail').forEach(thumb => {
            thumb.addEventListener('click', function() {
                const gallery = this.closest('.product-card-image-gallery');
                const mainImage = gallery.querySelector('.main-product-image');
                
                mainImage.src = this.src;
                mainImage.style.opacity = '0.5';
                setTimeout(() => {
                    mainImage.style.opacity = '1';
                }, 150);
                
                gallery.querySelectorAll('.product-thumbnail').forEach(t => {
                    t.classList.remove('active');
                });
                this.classList.add('active');
            });
        });
    }

    renderProducts();
    </script>
</body>
</html>
